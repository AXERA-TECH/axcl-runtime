syntax = "proto3";
package axcl.native.module.venc;
option optimize_for = @AXCL_PROTOCOL_OPTIMIZED_OPTION@;

enum Api
{
    AX_VENC_Init = 0;
    AX_VENC_Deinit = 1;
    AX_VENC_CreateChn = 2;
    AX_VENC_CreateChnEx = 3;
    AX_VENC_DestroyChn = 4;
    AX_VENC_SendFrame = 5;
    AX_VENC_SendFrameEx = 6;
    AX_VENC_SelectGrp = 7;
    AX_VENC_SelectClearGrp = 8;
    AX_VENC_SelectGrpAddChn = 9;
    AX_VENC_SelectGrpDeleteChn = 10;
    AX_VENC_SelectGrpQuery = 11;
    AX_VENC_GetFd = 12;
    AX_VENC_GetStream = 13;
    AX_VENC_ReleaseStream = 14;
    AX_VENC_GetStreamBufInfo = 15;
    AX_VENC_StartRecvFrame = 16;
    AX_VENC_StopRecvFrame = 17;
    AX_VENC_ResetChn = 18;
    AX_VENC_SetRoiAttr = 19;
    AX_VENC_GetRoiAttr = 20;
    AX_VENC_SetRcParam = 21;
    AX_VENC_GetRcParam = 22;
    AX_VENC_SetModParam = 23;
    AX_VENC_GetModParam = 24;
    AX_VENC_SetVuiParam = 25;
    AX_VENC_GetVuiParam = 26;
    AX_VENC_SetChnAttr = 27;
