    AX_VENC_JpegEncodeOneFrame = 43;
    AX_VENC_JpegGetThumbnail = 44;
}

message Request
{
    Api api = 1;
    repeated bytes parameters = 2;
}

message Response
{
    Api api = 1;
    repeated bytes parameters = 2;
}
