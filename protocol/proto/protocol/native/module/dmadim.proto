syntax = "proto3";
package axcl.native.module.dmadim;
option optimize_for = @AXCL_PROTOCOL_OPTIMIZED_OPTION@;

enum Api
{
    AX_DMADIM_Open = 0;
    AX_DMADIM_Cfg = 1;
    AX_DMADIM_Start = 2;
    AX_DMADIM_Waitdone = 3;
    AX_DMADIM_Close = 4;
    AX_DMA_MemCopy = 5;
    AX_DMA_MemSet = 6;
    AX_DMA_MemCopyXD = 7;
    AX_DMA_CheckSum = 8;
}

message Request
{
    Api api = 1;
    repeated bytes parameters = 2;
}

message Response
{
    Api api = 1;
    repeated bytes parameters = 2;
}
