syntax = "proto3";
package axcl.runtime.system;
option optimize_for = @AXCL_PROTOCOL_OPTIMIZED_OPTION@;


enum Module
{
    Alive = 0;      //!< heart beating
    Latency = 1;
    Log = 2;
    Control = 3;
}

enum Command
{
    CREATE_CONTEXT = 0;
    DESTROY_CONTEXT = 1;
    SHELL = 2;
    SETUP_PCIE_SUB_ID = 3;
    CREATE_STREAM = 4;
    DESTROY_STREAM = 5;
    SYNC_STREAM = 6;
    CREATE_EVENT = 7;
    DESTROY_EVENT = 8;
    RECORD_EVENT = 9;
    WAIT_EVENT = 10;
}
