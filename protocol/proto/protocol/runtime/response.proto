syntax = "proto3";
package axcl.runtime.response;
option optimize_for = @AXCL_PROTOCOL_OPTIMIZED_OPTION@;

import "protocol/runtime/type.proto";
import "protocol/runtime/system/response.proto";
import "protocol/runtime/memory/response.proto";
import "protocol/runtime/engine/response.proto";
import "protocol/runtime/p2p/response.proto";
import "protocol/runtime/usrwork/response.proto";

message Head
{
    Module module = 1;
}

message Body
{
    optional axcl.runtime.system.response.Payload system = 1;
    optional axcl.runtime.memory.response.Payload memory = 2;
    optional axcl.runtime.engine.response.Payload engine = 3;
    optional axcl.runtime.p2p.response.Payload p2p = 4;
    optional axcl.runtime.usrwork.response.Payload usrwork = 5;
}

message Payload
{
    Head head = 1;
    Body body = 2;
}
